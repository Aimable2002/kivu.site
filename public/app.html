<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kivu Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        #spa-shell {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        #app {
            width: 100%;
            max-width: 448px; /* max-w-md */
            height: 100%;
            overflow: hidden;
            position: relative;
            background: white;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }
        /* Page transition */
        .spa-enter {
            animation: spaEnter 0.18s ease both;
        }
        @keyframes spaEnter {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div id="spa-shell">
    <div id="app">
        <!-- Initial loading state -->
        <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px">
            <div style="width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#111;border-radius:50%;animation:spin 0.7s linear infinite"></div>
            <p style="font-size:11px;color:#9ca3af;font-weight:700">Loading Kivu...</p>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
</div>

<script type="module" src="/js/router.js"></script>
</body>
</html>
