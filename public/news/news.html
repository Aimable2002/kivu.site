<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kivu News - Amakuru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* DATA SAVER MAGIC */
        /* Когда класс data-saver-on активен, все картинки с классом news-img исчезают */
        .data-saver-on .news-img { display: none !important; }
    </style>
</head>
<body class="bg-gray-200 h-screen w-full flex justify-center overflow-hidden font-sans">

    <div id="news-container" class="w-full max-w-md h-full relative bg-gray-50 flex flex-col shadow-2xl overflow-hidden">
        
        <div class="bg-blue-900 text-white pt-10 pb-4 px-4 shadow-md shrink-0 z-20">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <button class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <h2 class="font-bold text-xl tracking-tight">Amakuru</h2>
                        <p class="text-[10px] text-blue-200 uppercase tracking-widest font-bold">Latest Updates</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 bg-blue-800 px-3 py-1.5 rounded-full border border-blue-700">
                    <i class="fas fa-leaf text-green-400 text-xs"></i>
                    <span class="text-[9px] font-bold uppercase">Data Saver</span>
                    <label class="relative inline-flex items-center cursor-pointer ml-1">
                        <input type="checkbox" id="data-saver-toggle" onchange="toggleDataSaver()" class="sr-only peer">
                        <div class="w-7 h-4 bg-gray-400 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-green-500"></div>
                    </label>
                </div>
            </div>

            <div class="flex gap-4 overflow-x-auto no-scrollbar text-sm font-bold border-b border-blue-800 pb-2">
                <button data-cat="top" onclick="window._loadCat('top')" class="news-tab-btn text-white border-b-2 border-white pb-1 shrink-0 transition text-sm font-bold">Top Stories</button>
                <button data-cat="rwanda" onclick="window._loadCat('rwanda')" class="news-tab-btn text-blue-300 hover:text-white shrink-0 transition text-sm font-bold">Rwanda</button>
                <button data-cat="business" onclick="window._loadCat('business')" class="news-tab-btn text-blue-300 hover:text-white shrink-0 transition text-sm font-bold">Business</button>
                <button data-cat="tech" onclick="window._loadCat('tech')" class="news-tab-btn text-blue-300 hover:text-white shrink-0 transition text-sm font-bold">Tech</button>
                <button data-cat="sports" onclick="window._loadCat('sports')" class="news-tab-btn text-blue-300 hover:text-white shrink-0 transition text-sm font-bold">Sports</button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto pb-[300px] bg-gray-100 p-3 space-y-3 pb-6">
            <div id="news-feed" class="space-y-3"></div>
            <button id="news-load-more" onclick="window._loadMore()"
                    class="hidden w-full bg-white border border-gray-200 text-gray-600 font-bold py-3 rounded-xl text-sm active:scale-95 transition mt-2">
                Load more
            </button>
        </div>

    </div>

    <div id="article-modal" class="hidden absolute inset-0 z-[100] bg-white flex flex-col slide-up">
        
        <div class="bg-white border-b border-gray-200 p-4 flex justify-between items-center shrink-0 safe-pt">
            <button onclick="window._closeArticle()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="flex gap-3 text-gray-500">
                <button><i class="fas fa-share-alt"></i></button>
                <button><i class="far fa-bookmark"></i></button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar">
            <div id="article-modal-img-wrap" class="w-full h-56 bg-gray-200 news-img">
                <img id="article-modal-img" src="" class="w-full h-full object-cover">
            </div>

            <div class="p-5 pb-24">
                <div class="flex items-center gap-2 mb-3">
                    <span id="article-modal-category" class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase"></span>
                    <span id="article-modal-time" class="text-[10px] text-gray-400 font-bold"></span>
                </div>
                
                <h1 id="article-modal-title" class="text-2xl font-bold text-gray-900 leading-tight mb-4"></h1>
                
                <div class="flex gap-2 mb-6 border-y border-gray-100 py-3">
                    <button id="article-ai-btn" onclick="window._getAISummary()"
                            class="flex-1 bg-indigo-50 border border-indigo-100 text-indigo-700 py-2 rounded-lg text-xs font-bold flex justify-center items-center gap-2 active:scale-95 transition">
                        <i class="fas fa-magic text-indigo-500"></i> AI Summary
                    </button>
                    <button id="article-listen-btn" onclick="window._toggleListen()"
                            class="flex-1 bg-gray-50 border border-gray-200 text-gray-700 py-2 rounded-lg text-xs font-bold flex justify-center items-center gap-2 active:scale-95 transition">
                        <i class="fas fa-volume-up"></i> Listen
                    </button>
                </div>

                <div id="article-ai-summary" class="hidden"></div>

                <div id="article-modal-body" class="text-gray-700 text-base leading-relaxed space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        // Data saver — CSS handles hiding images, this just toggles the class
        function toggleDataSaver() {
            const on = document.getElementById('data-saver-toggle').checked;
            document.getElementById('news-container').classList.toggle('data-saver-on', on);
        }
    </script>

    <script type="module">
        import { initNews, loadCategory, openArticle, closeArticle, loadMore, getAISummary, toggleListen } from '/js/news/news.js';

        // Grok API key — set here so it's accessible to the module  
        // u will have to update this key to what u want to use 
        window.GROK_API_KEY = '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';

        window._loadCat      = (cat) => loadCategory(cat);
        window._openArticle  = (id)  => openArticle(id);
        window._closeArticle = ()    => closeArticle();
        window._loadMore     = ()    => loadMore();
        window._getAISummary = ()    => getAISummary();
        window._toggleListen = ()    => toggleListen();

        initNews();
    </script>
</body>
</html>
